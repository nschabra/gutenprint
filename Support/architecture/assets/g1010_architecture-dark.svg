<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="100%" height="100%">
  <defs>
    <style>
      .window-bg { fill: #1e1e1e; stroke: #383838; stroke-width: 1.5; rx: 16; }
      .titlebar { fill: #262626; }
      .card { fill: #282828; stroke: #3f3f3f; stroke-width: 1.5; rx: 12; }
      .card-blue { fill: #1c2738; stroke: #0a84ff; stroke-width: 1.5; rx: 12; }
      .card-green { fill: #192a20; stroke: #30d158; stroke-width: 1.5; rx: 12; }
      .card-purple { fill: #271f33; stroke: #bf5af2; stroke-width: 1.5; rx: 12; }
      .card-orange { fill: #2f2518; stroke: #ff9f0a; stroke-width: 1.5; rx: 12; }
      .txt-title { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif; font-size: 15px; font-weight: 600; fill: #ffffff; }
      .txt-body { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif; font-size: 12px; fill: #98989d; }
      .badge-blue { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif; font-size: 11px; font-weight: 600; fill: #0a84ff; }
      .badge-green { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif; font-size: 11px; font-weight: 600; fill: #30d158; }
      .badge-purple { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif; font-size: 11px; font-weight: 600; fill: #bf5af2; }
      .badge-orange { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif; font-size: 11px; font-weight: 600; fill: #ff9f0a; }
      .conn-line { stroke: #0a84ff; stroke-width: 2; fill: none; stroke-dasharray: 4,4; }
      .arrow { fill: #0a84ff; }
      .win-title { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif; font-size: 13px; font-weight: 500; fill: #e1e1e6; }
    </style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" class="arrow" />
    </marker>
  </defs>

  <!-- macOS Window Frame -->
  <rect width="1000" height="640" class="window-bg" />
  
  <!-- macOS Titlebar with Traffic Lights -->
  <path d="M 0 16 C 0 7.16 7.16 0 16 0 L 984 0 C 992.84 0 1000 7.16 1000 16 L 1000 44 L 0 44 Z" class="titlebar"/>
  <circle cx="24" cy="22" r="6.5" fill="#ff5f56" stroke="#e0443e" stroke-width="0.5"/>
  <circle cx="44" cy="22" r="6.5" fill="#ffbd2e" stroke="#dea123" stroke-width="0.5"/>
  <circle cx="64" cy="22" r="6.5" fill="#27c93f" stroke="#1aab29" stroke-width="0.5"/>
  <text x="500" y="27" text-anchor="middle" class="win-title">Canon PIXMA G1010 — macOS AirPrint &amp; Gutenprint 5.3.5 Architecture</text>

  <!-- Layer 1: Client Ingress -->
  <g transform="translate(40, 70)">
    <rect width="280" height="95" class="card-blue"/>
    <text x="18" y="28" class="txt-title">macOS Client</text>
    <text x="18" y="50" class="txt-body">Cocoa Print Dialog / ColorSync ICC</text>
    <text x="18" y="72" class="badge-blue">Presets: Color / B&amp;W / Photo</text>
  </g>

  <g transform="translate(360, 70)">
    <rect width="280" height="95" class="card-purple"/>
    <text x="18" y="28" class="txt-title">iOS AirPrint (iPhone / iPad)</text>
    <text x="18" y="50" class="txt-body">DNS-SD Service: _color, _universal</text>
    <text x="18" y="72" class="badge-purple">IPP Everywhere · Port 8631</text>
  </g>

  <g transform="translate(680, 70)">
    <rect width="280" height="95" class="card-green"/>
    <text x="18" y="28" class="txt-title">Console Tool (g1010-ctl)</text>
    <text x="18" y="50" class="txt-body">Live ANSI Meters &amp; Mode Switcher</text>
    <text x="18" y="72" class="badge-green">One-Command CUPS PPD Setup</text>
  </g>

  <!-- Layer 2: Routing & Middleware -->
  <g transform="translate(40, 215)">
    <rect width="440" height="135" class="card"/>
    <text x="22" y="30" class="txt-title">macOS CUPS Print Subsystem</text>
    <text x="22" y="54" class="txt-body">Queue 1: Canon_G1010 (USB Direct)</text>
    <text x="22" y="74" class="txt-body">Queue 2: Canon_G1010_2 (Living Room Network)</text>
    <text x="22" y="98" class="badge-blue">PPD: ColorDevice=True, Duplex=PickOne</text>
    <text x="22" y="118" class="badge-orange">Security: *cupsSNMPSupplies: False</text>
  </g>

  <g transform="translate(520, 215)">
    <rect width="440" height="135" class="card-orange"/>
    <text x="22" y="30" class="txt-title">Living Room AirPrint Server</text>
    <text x="22" y="54" class="txt-body">Daemon: ippeveprinter -p 8631 -s 9,5 -2</text>
    <text x="22" y="74" class="txt-body">Router: print_wrapper.sh (Forwards Options)</text>
    <text x="22" y="98" class="badge-orange">Web Supplies: https://localhost:8631/supplies</text>
    <text x="22" y="118" class="badge-orange">Protection: CSP Active, X-Frame-Options DENY</text>
  </g>

  <!-- Layer 3: Driver Core -->
  <g transform="translate(160, 395)">
    <rect width="680" height="95" class="card-blue"/>
    <text x="24" y="30" class="txt-title">Gutenprint 5.3.5 Raster Processing Engine</text>
    <text x="24" y="54" class="txt-body">Driver: rastertogutenprint.5.3 · Model: bjc-PIXMA-G1010 (ID 17001000)</text>
    <text x="24" y="76" class="badge-blue">4-Channel CMYK Fine Curves · 4800x1200 dpi Matrix · Borderless Photo Media</text>
  </g>

  <!-- Layer 4: Hardware -->
  <g transform="translate(280, 535)">
    <rect width="440" height="60" class="card-green"/>
    <text x="24" y="36" class="txt-title" style="fill:#30d158;">Canon PIXMA G1010 Hardware</text>
    <text x="280" y="36" class="txt-body">USB 2.0 / Ink-Tank Engine</text>
  </g>

  <!-- Connection Arrows -->
  <path d="M 180 165 L 180 215" class="conn-line" marker-end="url(#arr)"/>
  <path d="M 500 165 L 500 190 L 740 190 L 740 215" class="conn-line" marker-end="url(#arr)"/>
  <path d="M 820 165 L 820 190 L 340 190 L 340 215" class="conn-line" marker-end="url(#arr)"/>
  <path d="M 740 350 L 740 375 L 420 375 L 420 395" class="conn-line" marker-end="url(#arr)"/>
  <path d="M 260 350 L 260 395" class="conn-line" marker-end="url(#arr)"/>
  <path d="M 500 490 L 500 535" class="conn-line" marker-end="url(#arr)"/>
</svg>
